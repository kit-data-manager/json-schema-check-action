name: JSON Schema Check
description:
  Check a given JSON schema file in the repository for being valid and for
  differences to the previous release.
author: Thomas Jejkal
branding:
  icon: check-square
  color: gray-dark

inputs:
  schemaPath:
    description: 'Relative path of the schema file to check'
    required: true
  validate:
    description: 'Validate the schema itself against the JSON specification'
    required: false
    default: 'true'
  createDiff:
    description:
      'Tries to create a diff to the previous release. If none exist, this will
      be skipped.'
    required: false
    default: 'true'
  token:
    description: 'GitHub token for reading previous tags.'
    required: false
  previousVersion:
    description: 'The previous version/tag name to apply the diff against.'
    required: false
  aiProvider:
    description:
      'AI provider used to analyze the diff automatically. One of "openai",
      "anthropic" or "openai-compatible". If empty, static hints are shown
      instead of an AI analysis.'
    required: false
  aiModel:
    description: 'The AI model id to use for the analysis.'
    required: false
  aiBaseUrl:
    description:
      'Optional base URL of an OpenAI-compatible endpoint. Defaults to the
      built-in URL of the selected provider.'
    required: false
  aiSecret:
    description:
      'The API key or secret for the AI provider. Should be passed via an
      encrypted GitHub Actions secret.'
    required: false
outputs:
  message:
    description: 'The schema check output as markdown message.'
  message-file:
    description: 'The schema check output as markdown file'

runs:
  using: node24
  main: dist/index.js
